<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EBE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<title>Kit de sobrevivência</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
:root{
  /* Uma coluna de telemóvel (máx. 560px): etiqueta de caixa de mantimentos no topo,
     linhas de inventário por categoria, separadores fixos em baixo, folhas que sobem para os formulários. */
  --fundo:#E8EBE7;
  --superficie:#F8F9F6;
  --tinta:#16201C;
  --tinta-2:#55635D;
  --linha:#C9D0CA;
  --acento:#BF450C;
  --sobre-acento:#FFFFFF;
  --ok:#1C7448; --ok-f:#D9EBDF;
  --aviso:#8A5600; --aviso-f:#F5E5BF;
  --critico:#AE2A22; --critico-f:#F6DAD6;
  --neutro-f:#DDE2DD;
  --sombra:rgba(10,16,13,.5);
  --display:"Saira Stencil One","Arial Narrow","Franklin Gothic Medium",Impact,sans-serif;
  --corpo:"Saira Semi Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fundo:#101614; --superficie:#19221F; --tinta:#E7ECE8; --tinta-2:#9AA7A1; --linha:#2D3934;
    --acento:#FF7B3D; --sobre-acento:#1B0C03;
    --ok:#5CC692; --ok-f:#173527; --aviso:#E6B24E; --aviso-f:#3A2D0E; --critico:#F27A70; --critico-f:#40191A;
    --neutro-f:#26312D; --sombra:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fundo:#101614; --superficie:#19221F; --tinta:#E7ECE8; --tinta-2:#9AA7A1; --linha:#2D3934;
  --acento:#FF7B3D; --sobre-acento:#1B0C03;
  --ok:#5CC692; --ok-f:#173527; --aviso:#E6B24E; --aviso-f:#3A2D0E; --critico:#F27A70; --critico-f:#40191A;
  --neutro-f:#26312D; --sombra:rgba(0,0,0,.65);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fundo);color:var(--tinta);font-family:var(--corpo);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--fundo)}
main{flex:1;min-height:0;overflow-y:auto;padding:0 16px 104px;outline:none}

/* Etiqueta do kit */
.etiqueta{margin:16px 0 14px;background:var(--superficie);border:2px solid var(--tinta);border-top:12px solid var(--acento);padding:12px 14px 14px}
.sobre{font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--tinta-2)}
.etiqueta h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,10vw,2.7rem);line-height:.95;text-transform:uppercase;margin:4px 0 14px;text-wrap:balance}
.prontidao{display:flex;align-items:flex-end;gap:12px;margin-bottom:10px}
.grande{font-family:var(--display);font-size:3.4rem;line-height:.8;font-variant-numeric:tabular-nums}
.grande small{font-size:1.6rem;color:var(--tinta-2)}
.prontidao p:last-child{font-weight:600;line-height:1.2}
.prontidao p:last-child span{display:block;font-weight:400;color:var(--tinta-2);font-size:.92rem}
.barra{display:flex;gap:2px;height:12px}
.barra i{display:block;min-width:0;transition:flex-grow .4s ease}
.barra .b-ok{background:var(--ok)}
.barra .b-parcial{background:var(--aviso)}
.barra .b-falta{background:var(--neutro-f);outline:1px solid var(--linha);outline-offset:-1px}
.legenda{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:.82rem;color:var(--tinta-2)}
.legenda span::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;background:var(--neutro-f);outline:1px solid var(--linha);outline-offset:-1px}
.legenda .l-ok::before{background:var(--ok);outline:0}
.legenda .l-parcial::before{background:var(--aviso);outline:0}

/* Avisos de validade */
.alerta{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-left:6px solid var(--critico);background:var(--critico-f);color:var(--tinta);padding:10px 12px;margin-bottom:8px;font-weight:600}
.alerta.a-aviso{border-left-color:var(--aviso);background:var(--aviso-f)}
.alerta.a-calmo{border-left-color:var(--tinta-2);background:var(--neutro-f)}
.alerta span:last-child{font-weight:400;white-space:nowrap;text-decoration:underline}

/* Filtros */
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.filtro{border:1.5px solid var(--tinta);background:transparent;padding:7px 12px;min-height:40px;font-weight:600;font-size:.92rem}
.filtro[aria-pressed="true"]{background:var(--tinta);color:var(--fundo)}

/* Categorias e linhas */
.cat h2{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--fundo);font-family:var(--display);font-weight:400;font-size:1.12rem;text-transform:uppercase;letter-spacing:.02em;padding:16px 0 6px;border-bottom:2px solid var(--tinta)}
.cat h2 .conta{font-family:var(--corpo);font-weight:600;font-size:.85rem;letter-spacing:0;color:var(--tinta-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.linha{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start;width:100%;text-align:left;background:var(--superficie);border:0;border-bottom:1px solid var(--linha);border-left:6px solid var(--linha);padding:11px 12px 11px 10px;min-height:58px}
.linha .nome{font-weight:600;overflow-wrap:anywhere}
.linha .sub{display:block;font-weight:400;font-size:.85rem;color:var(--tinta-2);margin-top:1px}
.linha .sub.s-critico{color:var(--critico);font-weight:600}
.linha .dir{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.linha .quant{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.95rem;color:var(--tinta-2)}
.linha .quant b{color:var(--tinta);font-size:1.1rem}
.medidor{grid-column:1/-1;height:5px;background:var(--neutro-f)}
.medidor i{display:block;height:100%;background:var(--aviso);transition:width .4s ease}
.est-completo{border-left-color:var(--ok)}
.est-completo .medidor i{background:var(--ok)}
.est-parcial{border-left-color:var(--aviso)}
.est-falta{border-left-color:var(--tinta-2)}
.est-na{border-left-color:var(--linha);background:transparent}
.est-na .nome{color:var(--tinta-2);font-weight:500}

.chip{display:inline-block;font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;white-space:nowrap;border:1.5px solid transparent}
.chip.c-ok{background:var(--ok-f);color:var(--ok)}
.chip.c-aviso{background:var(--aviso-f);color:var(--aviso)}
.chip.c-critico{background:var(--critico-f);color:var(--critico)}
.chip.c-falta{border-color:var(--tinta-2);color:var(--tinta)}
.chip.c-neutro{background:var(--neutro-f);color:var(--tinta-2)}

/* Produtos */
.titulo{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1;text-transform:uppercase;margin:20px 0 4px}
.lead{color:var(--tinta-2);margin-bottom:12px;max-width:60ch}
.prod{display:grid;grid-template-columns:56px 1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--superficie);border:0;border-bottom:1px solid var(--linha);padding:9px 12px 9px 9px;min-height:74px}
.mini{width:56px;height:56px;object-fit:cover;background:var(--neutro-f)}
.mini.vazia{display:grid;place-items:center;font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-2);text-align:center;line-height:1.1;border:1.5px dashed var(--tinta-2);background:transparent}
.prod .nome{font-weight:600;overflow-wrap:anywhere}
.prod .sub{display:block;font-weight:400;font-size:.85rem;color:var(--tinta-2)}
.prod .chips{display:block;margin-top:5px}
.prod .quant{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;font-size:1.05rem;align-self:start;padding-top:2px}
.grupo{font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2);padding:16px 0 6px;border-bottom:2px solid var(--tinta)}
.grupo.g-critico{color:var(--critico)}
.vazio{border:1.5px dashed var(--tinta-2);padding:18px 14px;margin-top:14px;color:var(--tinta-2)}
.vazio b{color:var(--tinta);display:block;margin-bottom:4px}
.estado-pag{padding:48px 4px;color:var(--tinta-2)}
.estado-pag b{display:block;color:var(--tinta);font-family:var(--display);font-weight:400;font-size:1.5rem;text-transform:uppercase;margin-bottom:6px}
.nota-rede{font-size:.85rem;color:var(--aviso);background:var(--aviso-f);padding:6px 10px;margin-top:10px}

/* Campos */
.rot{display:block;font-weight:600;font-size:.9rem;margin:14px 0 5px}
.ajuda{font-size:.84rem;color:var(--tinta-2);margin-top:4px}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;min-height:48px;padding:10px 12px;background:var(--fundo);border:1.5px solid var(--tinta-2);border-radius:3px;font-size:1rem}
textarea{min-height:84px;resize:vertical}
.passos{display:grid;grid-template-columns:52px 1fr 52px;gap:6px}
.passos input{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.passos button{border:1.5px solid var(--tinta);background:transparent;font-size:1.4rem;font-weight:600;min-height:48px;border-radius:3px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duas>div{position:relative;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 16px;border:2px solid var(--acento);background:var(--acento);color:var(--sobre-acento);font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-size:.95rem;border-radius:3px;text-align:center;cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--tinta)}
.btn.perigo{background:transparent;color:var(--critico);border-color:var(--critico)}
.btn[disabled]{opacity:.55;cursor:default}
.accoes{display:grid;gap:10px;margin-top:20px}
.erro{background:var(--critico-f);color:var(--critico);border-left:6px solid var(--critico);padding:9px 12px;margin-top:14px;font-weight:600}
.oculto{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.oculto:focus-visible+label{outline:3px solid var(--acento);outline-offset:2px}
.foto{aspect-ratio:4/3;max-height:260px;width:100%;display:grid;place-items:center;background:var(--fundo);border:1.5px dashed var(--tinta-2);color:var(--tinta-2);font-weight:600;overflow:hidden;margin-bottom:10px}
.foto.com{border-style:solid}
.foto img{width:100%;height:100%;object-fit:contain}
.troca{display:flex;align-items:center;gap:10px;padding:12px 0;font-weight:600}
.troca input{width:22px;height:22px;accent-color:var(--acento);flex:none}
.ligacao{background:none;border:0;padding:6px 0;text-decoration:underline;color:var(--tinta-2);font-size:.9rem}

/* Folha */
#fundo-folha{position:absolute;inset:0;background:var(--sombra);z-index:20;border:0;padding:0;width:100%}
#folha{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;background:var(--superficie);border-top:12px solid var(--acento);padding:14px 16px 24px;z-index:21;animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(36px)}to{transform:none}}
.folha-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.folha-topo h2{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.05;text-transform:uppercase;text-wrap:balance;outline:none;overflow-wrap:anywhere}
.fechar{flex:none;border:1.5px solid var(--tinta);background:transparent;min-width:44px;min-height:44px;font-size:1.2rem;font-weight:600;border-radius:3px}
.resumo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:12px 0 4px;padding:10px 12px;background:var(--fundo)}
.resumo div{font-size:.82rem;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.resumo div b{display:block;font-size:1.25rem;color:var(--tinta);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.sec-t{font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2);margin:20px 0 0;padding-bottom:6px;border-bottom:2px solid var(--tinta)}
#folha .prod{background:transparent;padding-left:0;padding-right:0}

/* Navegação e botão principal */
nav{flex:none;display:flex;background:var(--superficie);border-top:2px solid var(--tinta)}
nav button{flex:1;min-width:0;min-height:60px;background:transparent;border:0;border-top:4px solid transparent;font-weight:600;font-size:.8rem;letter-spacing:.03em;text-transform:uppercase;color:var(--tinta-2);padding:6px 4px}
nav button[aria-current="page"]{color:var(--tinta);border-top-color:var(--acento)}
nav .conta{display:inline-block;min-width:20px;padding:0 5px;margin-left:5px;background:var(--neutro-f);color:var(--tinta);font-size:.78rem;font-variant-numeric:tabular-nums;letter-spacing:0}
nav .conta.critico{background:var(--critico);color:var(--superficie)}
#fab{position:absolute;right:16px;bottom:76px;z-index:5;width:auto;box-shadow:0 3px 0 var(--tinta)}
#aviso{position:absolute;left:16px;right:16px;bottom:140px;z-index:30;background:var(--tinta);color:var(--fundo);padding:11px 14px;font-weight:600;text-align:center;pointer-events:none}
#app{padding-top:env(safe-area-inset-top)}
nav{padding-bottom:env(safe-area-inset-bottom)}
#fab{bottom:calc(76px + env(safe-area-inset-bottom))}
#aviso{bottom:calc(140px + env(safe-area-inset-bottom))}
.instalar{border:2px solid var(--tinta);background:var(--superficie);padding:12px 14px;margin:0 0 12px}
.instalar b{display:block;margin-bottom:2px}
.instalar p{color:var(--tinta-2);font-size:.92rem}
.instalar .btn{margin-top:10px}
.ficha{background:var(--superficie);border-left:6px solid var(--tinta-2);padding:12px 14px 14px;margin-top:12px}
.ficha h2{font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:6px}
.ficha p+p{margin-top:8px}
.ficha .f-ok{color:var(--ok);font-weight:600}
.ficha .f-aviso{color:var(--aviso);font-weight:600}
.ficha .accoes{margin-top:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="principal" tabindex="-1"><div class="estado-pag"><b>A abrir o kit</b>A ler os dados guardados neste telemóvel…</div></main>
  <button id="fab" class="btn" type="button" data-a="novo-produto" hidden>+ Registar produto</button>
  <nav aria-label="Secções">
    <button type="button" id="tab-kit" data-a="tab" data-tab="kit" aria-current="page">Kit</button>
    <button type="button" id="tab-falta" data-a="tab" data-tab="falta">Falta</button>
    <button type="button" id="tab-produtos" data-a="tab" data-tab="produtos">Produtos</button>
    <button type="button" id="tab-dados" data-a="tab" data-tab="dados">Dados</button>
  </nav>
  <button id="fundo-folha" type="button" data-a="fechar" aria-label="Fechar" tabindex="-1" hidden></button>
  <section id="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo" hidden></section>
  <div id="aviso" role="status" aria-live="polite" hidden></div>
</div>

<script src="avisos.js"></script>
<script>
(function(){
'use strict';

var CATS=[
  ['agua','Água'],['comida','Comida não perecível'],['saude','Saúde'],['luz','Luz, energia e informação'],
  ['abrigo','Abrigo e conforto'],['higiene','Higiene'],['docs','Documentos e dinheiro'],['familia','Se se aplicar à família']
];
var catIdx={};CATS.forEach(function(c,i){catIdx[c[0]]=i;});
var HASH={kit:'kit',falta:'falta-comprar',produtos:'produtos',dados:'dados'};
var VERSAO='2.1 de 10/11/2026';
var AV=self.KitAvisos||null,DIAS_6M=AV?AV.DIAS_6M:183; /* a regra dos 6 meses vem do avisos.js; 183 só serve de rede se esse ficheiro falhar */

var S={kit:[],prod:[],estado:'a-abrir',tab:'kit',filtro:'tudo',busca:'',folha:null,
       semRede:false,protegido:null,instalada:false,ultimaCopia:'',copia:null,aExportar:false,fundo:null};

var $=function(id){return document.getElementById(id);};
var nf=new Intl.NumberFormat('pt-PT',{maximumFractionDigits:2});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){if(typeof v==='number')return isFinite(v)?v:null;var t=String(v==null?'':v).replace(/\s/g,'').replace(',','.');if(t==='')return null;var n=Number(t);return isFinite(n)?n:null;}
function r2(n){return Math.round(n*100)/100;}
function hojeUTC(){var d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());}
function dataOk(v){return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v);}
function dias(v){if(!dataOk(v))return null;var p=v.split('-').map(Number);return Math.round((Date.UTC(p[0],p[1]-1,p[2])-hojeUTC())/864e5);}
function dataPt(v){var p=v.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function miniOk(m){return typeof m==='string'&&m.length<90000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(m);}
function idOk(i){return typeof i==='string'&&/^[A-Za-z0-9_-]{8,64}$/.test(i);}
function esperar(ms){return new Promise(function(r){setTimeout(r,ms);});}

/* ---------- Cálculo ---------- */
function unid(k,q){if(!k||!k.unidade)return '';return (q===1&&k.unidade1)?k.unidade1:k.unidade;}
function qtd(k,q){var u=unid(k,q);return nf.format(q)+(u?' '+u:'');}
function alvoTxt(k){var a=num(k.min),b=num(k.max);if(a===null||a<=0)return '';if(b!==null&&b>a)return nf.format(a)+'–'+nf.format(b)+' '+unid(k,b);return qtd(k,a);}
function porItem(){var m=new Map();S.prod.forEach(function(p){var a=m.get(p.kitId);if(!a){a=[];m.set(p.kitId,a);}a.push(p);});return m;}
function calc(k,ps){
  var val=0,cad=0;(ps||[]).forEach(function(p){var q=num(p.quantidade)||0,n=dias(p.validade);if(n!==null&&n<0)cad+=q;else val+=q;});
  val=r2(val);cad=r2(cad);
  var alvo=num(k.min);if(alvo!==null&&alvo<=0)alvo=null;
  var est=k.naoAplica?'na':alvo===null?(val>0?'completo':'falta'):(val>=alvo?'completo':val>0?'parcial':'falta');
  return {val:val,cad:cad,alvo:alvo,est:est,falta:alvo===null?null:r2(Math.max(0,alvo-val)),n:(ps||[]).length};
}
function resumo(){
  var m=porItem(),c=0,p=0,f=0,na=0;
  var linhas=S.kit.map(function(k){var r=calc(k,m.get(k.id));if(r.est==='completo')c++;else if(r.est==='parcial')p++;else if(r.est==='falta')f++;else na++;return {k:k,r:r};});
  return {linhas:linhas,c:c,p:p,f:f,na:na,total:c+p+f};
}
function validades(){var cad=0,breve=0,seis=0;S.prod.forEach(function(p){var n=dias(p.validade);if(n===null)return;if(n<0)cad++;else if(n<=30)breve++;else if(n<=DIAS_6M)seis++;});return {cad:cad,breve:breve,seis:seis};}
function chipVal(p){
  var n=dias(p.validade);
  if(n===null)return '<span class="chip c-neutro">Sem validade</span>';
  if(n<0)return '<span class="chip c-critico">Caducou a '+dataPt(p.validade)+'</span>';

  if(n<=30)return '<span class="chip c-aviso">Caduca em '+n+(n===1?' dia':' dias')+'</span>';
  return '<span class="chip c-neutro">Val. '+dataPt(p.validade)+'</span>';
}
var EST={completo:['c-ok','Completo'],parcial:['c-aviso','Parcial'],falta:['c-falta','Em falta'],na:['c-neutro','Não se aplica']};

function linhaKit(x){

  }

  return '<li><button type="button" class="linha est-'+r.est+'" data-a="item" data-id="'+esc(k.id)+'"><span class="nome">'+esc(k.nome)+sub+'</span><span class="dir">'+dir+'</span>'+med+'</button></li>';

function porCategoria(linhas,fn){

    h+='<section class="cat"><h2><span>'+esc(c[1])+'</span><span class="conta">'+ok+' de '+apl.length+' completos</span></h2><ul>'+vis.map(linhaKit).join('')+'</ul></section>';
  });

}

/* ---------- Fotografia ---------- */
function carregarImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){res({im:im,u:u});};im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('imagem'));};im.src=u;});}
function desenhar(im,max){var W=im.naturalWidth,H=im.naturalHeight,r=Math.min(1,max/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*r));c.height=Math.max(1,Math.round(H*r));var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);return c;}
async function prepararFoto(file){
  var x=await carregarImg(file);
  try{
    var blob=await new Promise(function(r){desenhar(x.im,1280).toBlob(r,'image/jpeg',0.82);});
    var mini=desenhar(x.im,220).toDataURL('image/jpeg',0.72);
    if(!blob||!miniOk(mini))throw new Error('imagem');
    return {blob:blob,mini:mini};
  }finally{URL.revokeObjectURL(x.u);}
}
async function novaFoto(input){
  var F=S.folha,file=input.files&&input.files[0];input.value='';
  if(!F||F.t!=='produto'||!file)return;
  try{
    var f=await prepararFoto(file);
    if(S.folha!==F)return;
    largarUrl();F.nova=f;F.semFoto=false;F.url=URL.createObjectURL(f.blob);pintaFoto();
  }catch(e){avisar('Não foi possível ler essa fotografia. Tenta tirar outra.');}
}

  if(!nome)er.push('Escreve o nome do produto.');

  if(q===null||q<0)er.push('A quantidade tem de ser um número, por exemplo 2 ou 1,5.');
  if(val&&!dataOk(val))er.push('A data de validade não é válida.');
  if(er.length){erroForm(er.join(' '));return;}
  erroForm('');ocupar(true);
  var antigo=F.orig&&idOk(F.orig.fotoId)?F.orig.fotoId:'',fotoId=antigo,mini=F.orig&&miniOk(F.orig.mini)?F.orig.mini:'',foto=null,nota='';
  if(F.nova){
    mini=F.nova.mini;fotoId=novoId();
    try{foto={id:fotoId,tipo:'image/jpeg',dados:await F.nova.blob.arrayBuffer()};}
    catch(e){foto=null;fotoId='';nota=' A fotografia ficou guardada só em tamanho pequeno.';}
  }else if(F.semFoto){fotoId='';mini='';}
  var agora=new Date().toISOString();
  /* Aviso dos 6 meses: se o produto já é guardado dentro desse prazo, avisa-se aqui no ecrã e fica marcado,
     para não repetir em notificação. Se a validade mudar, a marca recomeça. */
  var n6=dias(val||''),dentro6=n6!==null&&n6>=0&&n6<=DIAS_6M;
  var marca=(F.orig&&F.orig.validade===(val||'')&&typeof F.orig.aviso6m==='string')?F.orig.aviso6m:'';
  if(dentro6&&!marca)nota+=' Atenção: faltam menos de 6 meses para a validade.';
  var doc={id:F.id||novoId(),kitId:kitId,nome:nome,descricao:desc,quantidade:r2(q),validade:val||'',fotoId:fotoId,mini:mini,criadoEm:(F.orig&&F.orig.criadoEm)||agora,alteradoEm:agora,aviso6m:dentro6?(marca||agora):''};
  var ok=await escrever(function(){return tx(['produtos','fotos'],function(l){if(foto)l('fotos').put(foto);if(antigo&&antigo!==fotoId)l('fotos').delete(antigo);l('produtos').put(doc);});});
  if(!ok){ocupar(false);return;}
  await recarregar();pedirProtecao();fechar();render();avisar('Produto guardado.'+nota);
}

/* ---------- Cópia de segurança ---------- */
function b64(buf){var b=new Uint8Array(buf),t='',i;for(i=0;i<b.length;i+=0x8000)t+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(t);}
function deB64(t){var x=atob(t),b=new Uint8Array(x.length),i;for(i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return b.buffer;}
function descarregar(blob,nome){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},60000);}
async function exportar(){
  if(S.aExportar||S.estado!=='pronto')return;
  S.aExportar=true;render();
  try{
    var fotos=await ler('fotos'),d=new Date(),z=function(n){return ('0'+n).slice(-2);};
    var nome='kit-sobrevivencia-'+d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'.json';
    var dados={app:'kit-sobrevivencia',formato:1,exportadoEm:d.toISOString(),kit:S.kit,produtos:S.prod,fotos:fotos.map(function(f){return {id:f.id,tipo:f.tipo,b64:b64(f.dados)};})};
    var blob=new Blob([JSON.stringify(dados)],{type:'application/json'}),feito=false,cancelou=false;
    try{
      var fich=new File([blob],nome,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[fich]})){await navigator.share({files:[fich],title:'Cópia do kit de sobrevivência'});feito=true;}
    }catch(e){if(e&&e.name==='AbortError')cancelou=true;}
    if(!feito&&!cancelou){descarregar(blob,nome);feito=true;}
    if(feito){
      await tx(['meta'],function(l){l('meta').put({k:'ultimaCopia',v:d.toISOString()});});
      S.ultimaCopia=d.toISOString();avisar('Cópia criada: '+nome);
    }
  }catch(e){avisar('Não foi possível criar a cópia.');}
  S.aExportar=false;render();
}
async function lerCopia(input){
  var f=input.files&&input.files[0];input.value='';if(!f)return;
  var d=null;try{d=JSON.parse(await f.text());}catch(e){d=null;}
  if(!d||d.app!=='kit-sobrevivencia'||!Array.isArray(d.kit)||!Array.isArray(d.produtos)){avisar('Esse ficheiro não é uma cópia do kit.');return;}
  var fotos=[];
  (Array.isArray(d.fotos)?d.fotos:[]).forEach(function(x){try{if(x&&idOk(x.id)&&typeof x.b64==='string')fotos.push({id:x.id,tipo:/^image\/(jpeg|png|webp)$/.test(x.tipo)?x.tipo:'image/jpeg',dados:deB64(x.b64)});}catch(e){}});
  S.copia={kit:d.kit.map(limparItem).filter(Boolean),prod:d.produtos.map(limparProduto).filter(Boolean),fotos:fotos,data:typeof d.exportadoEm==='string'?d.exportadoEm:''};
  render();
}
async function repor(){
  var c=S.copia;if(!c)return;S.copia=null;
  var ok=await escrever(function(){return tx(LOJAS,function(l){
    l('kit').clear();l('produtos').clear();l('fotos').clear();
    c.kit.forEach(function(x){l('kit').put(x);});c.prod.forEach(function(x){l('produtos').put(x);});c.fotos.forEach(function(x){l('fotos').put(x);});
    l('meta').put({k:'semeado',v:new Date().toISOString()});
  });});
  if(ok){await recarregar();avisar('Dados repostos a partir da cópia.');}
  render();

  else if(t.id==='i-na-rapido'&&F&&F.t==='item')trocarNa(F.id,t.checked,t);
});
document.addEventListener('input',function(e){if(e.target.id==='busca'){S.busca=e.target.value;var l=$('lista-prod');if(l)l.innerHTML=listaProdutos();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.folha&&!S.folha.ocupado)fechar();});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')verificarAvisos();});
window.addEventListener('hashchange',function(){var t=tabDoHash();if(t!==S.tab){S.tab=t;render();}});

/* ---------- Dados guardados no telemóvel ---------- */
var BD=null,LOJAS=['kit','produtos','fotos','meta'];
function abrirBD(){return new Promise(function(res,rej){
  var r;try{r=indexedDB.open('kit-sobrevivencia',1);}catch(e){rej(e);return;}
  r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('kit',{keyPath:'id'});d.createObjectStore('produtos',{keyPath:'id'});d.createObjectStore('fotos',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'});};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.onblocked=function(){rej(new Error('bloqueada'));};
});}
function tx(lojas,fn){return new Promise(function(res,rej){
  var t;try{t=BD.transaction(lojas,'readwrite');}catch(e){rej(e);return;}
  t.oncomplete=function(){res();};t.onerror=function(){rej(t.error||new Error('bd'));};t.onabort=function(){rej(t.error||new Error('bd'));};
  try{fn(function(l){return t.objectStore(l);});}catch(e){try{t.abort();}catch(x){}rej(e);}
});}
function ler(loja,chave){return new Promise(function(res,rej){
  var r;try{var l=BD.transaction(loja).objectStore(loja);r=chave===undefined?l.getAll():l.get(chave);}catch(e){rej(e);return;}
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};
});}
function novoId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);}
function txt(v,n){return typeof v==='string'?v.slice(0,n):'';}
function chaveOk(i){return typeof i==='string'&&/^[A-Za-z0-9_-]{1,64}$/.test(i);}
function limparItem(x){
  if(!x||!chaveOk(x.id)||!txt(x.nome,90).trim())return null;
  var a=num(x.min),b=num(x.max);if(a!==null&&a<=0)a=null;if(a===null||b===null||b<=a)b=null;
  var u=txt(x.unidade,20).trim()||'un';
  return {id:x.id,cat:(typeof x.cat==='string'&&x.cat in catIdx)?x.cat:'comida',ordem:num(x.ordem)||0,nome:txt(x.nome,90).trim(),min:a,max:b,unidade:u,unidade1:txt(x.unidade1,20).trim()||u,nota:txt(x.nota,400),naoAplica:x.naoAplica===true};
}
function limparProduto(p){
  if(!p||!chaveOk(p.id))return null;
  var q=num(p.quantidade);
  return {id:p.id,kitId:txt(p.kitId,64),nome:txt(p.nome,80).trim()||'Sem nome',descricao:txt(p.descricao,600),quantidade:q===null||q<0?0:r2(q),validade:dataOk(p.validade)?p.validade:'',fotoId:idOk(p.fotoId)?p.fotoId:'',mini:miniOk(p.mini)?p.mini:'',criadoEm:txt(p.criadoEm,40),alteradoEm:txt(p.alteradoEm,40),aviso6m:txt(p.aviso6m,40)};
}
function ordKit(a,b){var x=a.cat in catIdx?catIdx[a.cat]:99,y=b.cat in catIdx?catIdx[b.cat]:99;return x-y||(num(a.ordem)||0)-(num(b.ordem)||0)||String(a.nome||'').localeCompare(String(b.nome||''),'pt');}
async function recarregar(){var k=await ler('kit'),p=await ler('produtos');S.kit=k.sort(ordKit);S.prod=p;}
async function semear(){
  if(await ler('meta','semeado'))return;
  var r=await fetch('kit-inicial.json');if(!r.ok)throw new Error('lista');
  var lista=(await r.json()).map(limparItem).filter(Boolean);if(!lista.length)throw new Error('lista');
  await tx(['kit','meta'],function(l){lista.forEach(function(x){l('kit').put(x);});l('meta').put({k:'semeado',v:new Date().toISOString()});});
}
function verProtecao(){
  if(!(navigator.storage&&navigator.storage.persisted))return;
  navigator.storage.persisted().then(function(v){if(S.protegido!==v){S.protegido=v;if(S.tab==='dados')render();}}).catch(function(){});
}
function pedirProtecao(){
  if(S.protegido===true||!(navigator.storage&&navigator.storage.persist))return;
  navigator.storage.persist().then(function(v){S.protegido=v;}).catch(function(){});
}
async function iniciar(){
  try{if(!BD)BD=await abrirBD();}catch(e){S.estado='erro-bd';render();return;}
  try{await semear();}catch(e){S.estado='erro-lista';render();return;}
  try{await recarregar();var u=await ler('meta','ultimaCopia');S.ultimaCopia=u&&typeof u.v==='string'?u.v:'';}catch(e){S.estado='erro-bd';render();return;}
  S.estado='pronto';render();verProtecao();
  if(estadoNotif()==='granted'){ligarFundo();verificarAvisos();}
}

/* ---------- Notificações de validade ---------- */
async function ligarFundo(){
  var antes=S.fundo;
  try{
    var reg=await navigator.serviceWorker.ready;
    if(!reg.periodicSync)S.fundo=false;
    else{
      var st=await navigator.permissions.query({name:'periodic-background-sync'});
      if(st.state!=='granted')S.fundo=false;
      else{await reg.periodicSync.register('validades',{minInterval:12*60*60*1000});S.fundo=true;}
    }
  }catch(e){S.fundo=false;}
  if(antes!==S.fundo&&S.tab==='dados')render();
}
var aVerificar=false;
async function verificarAvisos(){
  if(aVerificar||S.estado!=='pronto'||estadoNotif()!=='granted')return;
  aVerificar=true;
  try{var reg=await navigator.serviceWorker.ready,n=await AV.verificar(reg);if(n){await recarregar();render();}}catch(e){}
  aVerificar=false;
}
async function ligarNotif(){
  if(estadoNotif()==='sem')return;
  var r='default';try{r=await Notification.requestPermission();}catch(e){}
  if(r==='granted'){await ligarFundo();avisar('Notificações activas.');verificarAvisos();}
  else if(r==='denied')avisar('As notificações ficaram bloqueadas.');
  render();
}
async function testeNotif(){
  try{
    var reg=await navigator.serviceWorker.ready;
    await reg.showNotification('Kit de sobrevivência',{body:'Notificação de teste. É assim que a aplicação avisa das validades.',tag:'teste',icon:'icones/icone-192.png',data:{ir:'produtos'}});
    avisar('Notificação de teste enviada.');
  }catch(e){avisar('O telemóvel não deixou mostrar a notificação.');}
}

/* ---------- Instalação e uso sem internet ---------- */
var pedidoInstalar=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();pedidoInstalar=e;render();});
window.addEventListener('appinstalled',function(){pedidoInstalar=null;S.instalada=true;render();});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(function(){});
  navigator.serviceWorker.ready.then(function(){S.semRede=true;if(S.tab==='dados')render();}).catch(function(){});
  navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.ir==='produtos'&&S.estado==='pronto')irPara('produtos');});
}

S.tab=tabDoHash();
renderNav();
iniciar();
})();
</script>
